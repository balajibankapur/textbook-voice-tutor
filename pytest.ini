[pytest]
testpaths = tests
pythonpath = .
# live_model tests exercise sentence-transformers and conflict with faiss
# OpenMP state in the same process; run them separately via `pytest -m live_model`.
addopts = -q -m "not live_model and not live_jev and not live_openai"
markers =
    live_model: hits the real embedding model; incompatible with faiss in the same process
    live_jev: hits the real Jev API via OpenRouter; needs OPENROUTER_API_KEY
    live_openai: hits OpenAI directly (STT/TTS); needs OPENAI_API_KEY
env =
    HF_HUB_DISABLE_PROGRESS_BARS=1
    TOKENIZERS_PARALLELISM=false
    TRANSFORMERS_NO_ADVISORY_WARNINGS=1
    TQDM_DISABLE=1
