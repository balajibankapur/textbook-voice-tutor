<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #1f2d3d; }
      .sub   { font-size: 12px; fill: #5a5a5a; font-style: italic; }
      .label { font-size: 12px; fill: #333; text-anchor: middle; }
      .num   { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .axis  { stroke: #999; stroke-width: 1; }
      .grid  { stroke: #e0e0e0; stroke-width: 1; stroke-dasharray: 3,3; }
      .delta { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .delta-good { fill: #117c3f; }
    </style>
  </defs>

  <text x="30" y="30" class="title">A/B · Jev chat API vs. real decisions API</text>
  <text x="30" y="52" class="sub">Same 14-question labelled set · same model slug `jev-1.14` · only the endpoint changed</text>

  <!-- Left panel: Avg gate latency -->
  <text x="60" y="100" class="title" font-size="14">Avg gate latency (ms)</text>
  <line x1="60" y1="340" x2="420" y2="340" class="axis"/>
  <line x1="60" y1="340" x2="60" y2="120" class="axis"/>

  <!-- grid lines -->
  <line x1="60" y1="280" x2="420" y2="280" class="grid"/>
  <text x="52" y="284" font-size="10" fill="#999" text-anchor="end">1000</text>
  <line x1="60" y1="220" x2="420" y2="220" class="grid"/>
  <text x="52" y="224" font-size="10" fill="#999" text-anchor="end">2000</text>
  <line x1="60" y1="160" x2="420" y2="160" class="grid"/>
  <text x="52" y="164" font-size="10" fill="#999" text-anchor="end">3000</text>

  <!-- Chat API bar (2931 ms) -->
  <rect x="120" y="164" width="80" height="176" fill="#dc7a6a"/>
  <text x="160" y="252" class="num">2,931</text>
  <text x="160" y="360" class="label">Chat API</text>
  <text x="160" y="376" class="label" font-size="10" fill="#999">jev-router</text>

  <!-- Decisions API bar (675 ms) -->
  <rect x="280" y="300" width="80" height="40" fill="#4b9c6b"/>
  <text x="320" y="326" class="num">675</text>
  <text x="320" y="360" class="label">Decisions API</text>
  <text x="320" y="376" class="label" font-size="10" fill="#999">jev-1.14</text>

  <!-- Delta -->
  <text x="240" y="110" class="delta delta-good">4.3× faster</text>
  <path d="M 170 118 Q 240 90 310 118" fill="none" stroke="#117c3f" stroke-width="1.5"/>

  <!-- Right panel: cost -->
  <text x="500" y="100" class="title" font-size="14">Cost per gate call ($USD)</text>
  <line x1="500" y1="340" x2="860" y2="340" class="axis"/>
  <line x1="500" y1="340" x2="500" y2="120" class="axis"/>

  <!-- grid -->
  <line x1="500" y1="280" x2="860" y2="280" class="grid"/>
  <text x="492" y="284" font-size="10" fill="#999" text-anchor="end">0.0001</text>
  <line x1="500" y1="220" x2="860" y2="220" class="grid"/>
  <text x="492" y="224" font-size="10" fill="#999" text-anchor="end">0.0002</text>
  <line x1="500" y1="160" x2="860" y2="160" class="grid"/>
  <text x="492" y="164" font-size="10" fill="#999" text-anchor="end">0.0003</text>

  <!-- Chat bar: $0.0003 → 180 px -->
  <rect x="560" y="160" width="80" height="180" fill="#dc7a6a"/>
  <text x="600" y="248" class="num">$0.0003</text>
  <text x="600" y="360" class="label">Chat API</text>
  <text x="600" y="376" class="label" font-size="10" fill="#999">jev-router</text>

  <!-- Decisions bar: $0.000013 ≈ 8 px -->
  <rect x="720" y="332" width="80" height="8" fill="#4b9c6b"/>
  <text x="760" y="326" class="num" fill="#333">$0.000013</text>
  <text x="760" y="360" class="label">Decisions API</text>
  <text x="760" y="376" class="label" font-size="10" fill="#999">jev-1.14</text>

  <text x="680" y="110" class="delta delta-good">~25× cheaper</text>
  <path d="M 610 118 Q 680 90 750 118" fill="none" stroke="#117c3f" stroke-width="1.5"/>

  <!-- Bottom: accuracy stays -->
  <rect x="30" y="410" width="840" height="50" fill="#f3f3f3" stroke="#ccc"/>
  <text x="60" y="432" class="title" font-size="14">Gate accuracy: 100% → 100% · Retrieval recall: 100% → 100% · Keyword hit: 86% → 86%</text>
  <text x="60" y="450" class="sub">Same answers. Different latency and cost class.</text>
</svg>
